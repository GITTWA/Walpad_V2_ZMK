# Abilita ZMK Studio
CONFIG_ZMK_STUDIO=y
# Disabilita il blocco di sicurezza di ZMK Studio per poter modificare i tasti al volo senza combinazioni
CONFIG_ZMK_STUDIO_LOCKING=n

# Risparmio energetico e Deep Sleep (dopo 30 min di inattività)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900

# Abilita la lettura precisa del livello batteria
CONFIG_ZMK_BATTERY_REPORTING=y